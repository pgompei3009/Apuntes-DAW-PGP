<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>formulario</title>
</head>
<body>
    <div class="bod">
        <h2>Formulario de contacto</h2>
        <section>
            <div class="inp">
                <Label>Nombre:</Label>
                <input type="text" name="nombre" id="nombre">
            </div>
            <div class="inp">
                <Label>Apellidos:</Label>
                <input type="text" name="apll" id="apll">
            </div>
            <div class="inp">
                <Label>Correo:</Label>
                <input type="email" name="correo" id="correo">
            </div>
        </section>
        <div class="problema">
            <label for="problem">Cuéntanos tu problema:</label><br>
            <textarea name="problem" id="problem" rows="5" cols="50"></textarea>
        </div>
        <button type="submit">Enviar</button>
    </div>
</body>
</html>
