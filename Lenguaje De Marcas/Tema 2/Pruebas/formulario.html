<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form>
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required minlength="3" maxlength="30">
        <br>
        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="pass">Contraseña:</label>
        <input type="password" name="pass" id="pass" required>
        <br>
        <fieldset>
            <legend>Género</legend>
            <input type="radio" id="hombre" name="genero" value="hombre">
            <label for="hombre">Hombre</label>
            <input type="radio" id="mujer" name="genero" value="mujer">
            <label for="mujer">Mujer</label>
            <input type="radio" id="otro" name="genero" value="otro">
            <label for="otro">Otro</label>
        </fieldset>
        <br>
        <label for="edad">Edad:</label>
        <input type="" >
        <br>
        <label for="bdate">Fecha de nacimiento:</label>
        <input type="date" id="bdate" name="bdate">
        <br>
        <label for="hijos">Número de hijos:</label>
        <input type="number" id="hijos" name="hijos">
        <br>
        <label for="avatar">Subir avatar:</label>
        <input type="file" id="avatar" name="avatar">
        <br>
        <label for="provincia">Selecciona tu provincia:</label>
        <select id="provincia" name="provincia">
            <option value="almeria">Almería</option>
            <option value="cadiz">Cádiz</option>
            <option value="cordoba">Córdoba</option>
            <option value="granada">Granada</option>
            <option value="huelva">Huelva</option>
            <option value="jaen">Jaén</option>
            <option value="malaga">Málaga</option>
            <option value="sevilla">Sevilla</option>
        </select>
        <br>
        <fieldset>
            <legend>Seleeciona tus intereses</legend>
            <input type="checkbox" id="informatica" name="informatica" value="informatica">
            <label for="informatica">Informática</label>
            <input type="checkbox" id="cripto" name="cripto" value="cripto">
            <label for="cripto">Criptomonedas</label>
            <input type="checkbox" id="ciclismo" name="ciclismo" value="ciclismo">
            <label for="ciclismo">Ciclismo</label>
            <br>
            <input type="checkbox" id="escalada" name="escalada" value="escalada">
            <label for="escalada">Escalada</label>
            <input type="checkbox" id="lol" name="lol" value="lol">
            <label for="lol">League of Legends</label>
            <input type="checkbox" id="lectura" name="lectura" value="lectura">
            <label for="lectura">Lectura</label>
        </fieldset>
        <br>
        <label for="lenguaje">Selecciona el lenguaje que quieres aprender</label>
        <input list="lenguajes" id="lenguaje" name="lenguaje">
        <datalist id="lenguajes" name="lenguajes">
            <option value="Python">Python</option>
            <option value="JavaScript"></option>
            <option value="Java"></option>
            <option value="C#"></option>
            <option value="C++"></option>
            <option value="PHP"></option>
            <option value="Kotlin"></option>
        </datalist>
        <br>
        <label for="vida">Cuentanos tu vida</label>
        <br>
        <textarea id="vida" name="vida" rows="5" cols="50"></textarea>
        <br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
